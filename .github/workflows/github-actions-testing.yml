name: CI-CD pipeLine
run-name: ${{ github.actor }} is running the CI/CD pipeline
on: [push, pull_request]

jobs:
  CI-Pipeline:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - run: echo "The CI/CD pipeline is triggered"
      - name: Cloning the repository in runner
        uses: actions/checkout@v6

      - run: echo "💡 The ${{ github.repository }} repository has been cloned to the runner."

      - name: Visiting the directory contents
        run: ls -l

      - name: Setting up node Version
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Installing the packages/dependencies
        run: npm ci

      - name: Type check TypeScript
        run: npx tsc --noEmit

      - name: Starting the test suites
        run: npm test

      - if: always()
        run: echo "🍏 This job's status is ${{ job.status }}."

  Deploy:
    needs: CI-Pipeline
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Deploying..."
